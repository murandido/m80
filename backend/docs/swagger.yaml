        type: string
      kind:
        description: 'Kind is the movement in the panel''s terms: redemption|refund|accrual|purchase|expiration|other.'
        example: redemption
        type: string
      linked_batch:
        $ref: '#/definitions/schemas.AzulStatementLinkedBatch'
      linked_issuance:
        allOf:
        - $ref: '#/definitions/schemas.AzulStatementLinkedIssuance'
        description: |-
          LinkedIssuance is the resolved issuance (for redemptions/refunds/promotions), or null when
          nothing matched. LinkedBatch is the resolved batch (for purchases/accruals), or null. A
          line carries at most one of them.
      locator:
        example: MJF6HC
        type: string
      note:
        description: |-
          Note is the free-text detail parsed out of a non-flight redemption's comment - the hotel,
          assist card or product of an Azul Viagens redemption ("Ibis Budget … (20/11 - 22/11)").
          Empty for a flight redemption or an Azul pelo Mundo debit, which carry only a code.
        type: string
      occurred_at:
        description: |-
          OccurredAt is the movement's instant in São Paulo time (RFC 3339), or null on lines synced
          before the airline's clock was kept.
        example: "2026-08-27T11:07:06-03:00"
        type: string
      occurred_on:
        example: "2026-08-27"
        type: string
      origin:
        example: GRU
        type: string
      partner_name:
        type: string
      points:
        description: Points carries the airline's own sign (negative when points left
          the account).
        example: -25000
        type: integer
      type_code:
        example: AN
        type: string
      type_description:
        type: string
    type: object
  schemas.AzulStatementGroup:
    properties:
      day_balance:
        example: 518217
        type: integer
      key:
        description: Key is the first line's link key (the locator), what a manual
          link is stored under.
        example: RQR7HK
        type: string
      kind:
        example: redemption
        type: string
      line_count:
        example: 2
        type: integer
      lines:
        items:
          $ref: '#/definitions/schemas.AzulStatementEntry'
        type: array
      linked_batch:
        $ref: '#/definitions/schemas.AzulStatementLinkedBatch'
      linked_issuance:
        $ref: '#/definitions/schemas.AzulStatementLinkedIssuance'
      locator:
        example: RQR7HK
        type: string
      occurred_at:
        example: "2026-09-26T10:52:07-03:00"
        type: string
      occurred_on:
        example: "2026-09-26"
        type: string
      points:
        description: Points is the group's signed total; LineCount how many movements
          it folds.
        example: -60000
        type: integer
      points_mismatch:
        description: |-
          PointsMismatch is true when the linked issuance does not add up: the locator's redemptions
          against its points, or its refunds against its refunded points.
        example: false
        type: boolean
      routes:
        description: Routes are the legs in the order they were flown ("CNF→SSA",
          "SSA→CNF").
        items:
          type: string
        type: array
    type: object
  schemas.AzulStatementLinkedBatch:
    properties:
      acquired_on:
        example: "2026-08-27"
        type: string
      batch_id:
        type: string
      cost_cents:
        example: 224775
        type: integer
      manual:
        example: false
        type: boolean
      origin:
        example: Livelo
        type: string
      points:
        example: 158175
        type: integer
    type: object
  schemas.AzulStatementLinkedIssuance:
    properties:
      destination:
        example: REC
        type: string
      issuance_id:
        type: string
      issued_on:
        example: "2026-08-27"
        type: string
      manual:
        example: false
        type: boolean
      origin:
        example: GRU
        type: string
      passenger_name:
        example: MARIA SILVA
        type: string
      points:
        example: 25000
        type: integer
    type: object
  schemas.AzulStatementResponse:
    properties:
      reconciliation:
        $ref: '#/definitions/schemas.StatementReconciliationResponse'
      sync_state:
        $ref: '#/definitions/schemas.AzulSyncStateResponse'
    type: object
  schemas.AzulStatementSingleResponse:
    properties:
      data:
        $ref: '#/definitions/schemas.AzulStatementResponse'
      message:
        example: Extrato conciliado
        type: string
      success:
        example: true
        type: boolean
    type: object
  schemas.AzulSyncStateResponse:
    properties:
      connected:
        description: |-
          Connected is whether a customerKey has been discovered for the account. False means it has
          never been connected, so the panel offers "Conectar" rather than a running state.
        example: true
        type: boolean
      connecting:
        description: |-
          Connecting is whether a background connect login is in flight right now. The connect is
          asynchronous, so the panel shows "conectando" and polls this until it clears - then Connected
          is true (success) or the state carries the failure.
        example: false
        type: boolean
      connecting_since:
        description: |-
          ConnectingSince is when the in-flight login started, so the panel can show the elapsed time
          (the login legitimately takes minutes across retries). Null whenever Connecting is false.
        type: string
      consecutive_failures:
        description: |-
          ConsecutiveFailures is how many rounds (login or read) have failed in a row; it is what
          tips the state into needs_attention once it crosses the threshold.
        example: 0
        type: integer
      detail:
        description: |-
          Detail is a short human note for the panel (the last error, or a balance mismatch). Null
          on an account that has nothing to report yet.
        type: string
      last_balance_points:
        type: integer
      last_synced_at:
        description: LastSyncedAt and LastBalancePoints are the last successful read;
          null until the first one.
        type: string
      state:
        description: State is one of pending|ok|error|inconsistent|needs_attention
          (see data.AzulSync*).
        example: ok
        type: string
      updated_at:
        description: UpdatedAt is when the state row last changed; null on an account
          with no row yet.
        type: string
    type: object
  schemas.AzulSyncStateSingleResponse:
    properties:
      data:
        $ref: '#/definitions/schemas.AzulSyncStateResponse'
      message:
        example: Estado carregado
        type: string
      success:
        example: true
        type: boolean
    type: object
  schemas.BulkIncrementSupplierExportCounterRequest:
    properties:
      administrator_ids:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - administrator_ids
    type: object
  schemas.BulkSupplierExportCounterResponse:
    properties:
      updated:
        type: integer
    type: object
  schemas.BulkSupplierExportCounterSingleResponse:
    properties:
      data:
        $ref: '#/definitions/schemas.BulkSupplierExportCounterResponse'
      message:
        example: Contadores atualizados com sucesso
        type: string
      success:
        example: true
        type: boolean
    type: object
  schemas.CancelIssuanceRequest:
    properties:
      cancellation_fee:
        type: integer
      cancellation_only:
        description: |-
          CancellationOnly marks the issuance as a row that exists only to carry this
          estorno: the booking was made outside the panel, so its points were never miles
          issued here and the supplier balance must count the refund alone. Registering the
          booking and then cancelling it with twice the points is what this replaces.
        type: boolean
      cancelled_on:
        description: |-
          CancelledOn (YYYY-MM-DD) is the day the airline gave the points back, when that is
          not today. It is what dates the refund in the costing and in the supplier balance,
          so a cancellation recorded a week late still lands in the week it happened.
        example: "2026-09-05"
        type: string
      refunded_points:
        type: integer
      refunded_taxes:
        type: integer
    type: object
  schemas.ClientListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/schemas.ClientResponse'
        type: array
      message:
        example: Clientes listados com sucesso
        type: string
      success:
        example: true
        type: boolean
    type: object
  schemas.ClientPaginatedData:
    properties:
      clients:
        items:
          $ref: '#/definitions/schemas.ClientResponse'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  schemas.ClientPaginatedResponse:
    properties:
      data:
        $ref: '#/definitions/schemas.ClientPaginatedData'
      message:
        example: Clientes listados com sucesso
        type: string
      success:
        example: true
        type: boolean
    type: object
  schemas.ClientPaymentAllocation:
    properties:
      amount_cents:
        example: 50000
        type: integer
      program_locator:
        example: ABC123
        type: string
      sale_id:
        type: string
    type: object
  schemas.ClientPaymentHistoryItem:
    properties:
      allocations:
        description: |-
          Allocations are the sales this payment covers, oldest first. What they do not add
          up to is part of the credit.
        items:
          $ref: '#/definitions/schemas.ClientPaymentAllocation'
        type: array
      amount_cents:
        example: 120000
        type: integer
      client_id:
        description: |-
          ClientID and ClientName say whose payment it is, which the history of several
          clients at once has to show on every line.
        type: string
      client_name:
        type: string
      created_at:
        type: string
      created_by_name:
        type: string
      deleted_at:
        description: DeletedAt is set on an undone payment, which keeps no allocations.
        type: string
      deleted_by_name:
        type: string
      id:
        type: string
      paid_on:
        example: "2026-09-14"
        type: string
    type: object
  schemas.ClientPaymentHistoryResponse:
    properties:
      credit_cents:
        description: CreditCents is what the active payments brought in and no sale
          took.
        example: 20000
        type: integer
      payments:
        items:
          $ref: '#/definitions/schemas.ClientPaymentHistoryItem'
        type: array
    type: object
  schemas.ClientPaymentHistorySingleResponse:
    properties:
      data:
        $ref: '#/definitions/schemas.ClientPaymentHistoryResponse'
      message:
        example: Pagamentos do cliente listados com sucesso
        type: string
      success:
        example: true
        type: boolean
    type: object
  schemas.ClientPaymentResponse:
    properties:
      applied_cents:
        description: AppliedCents is how much of the amount went into sales; the rest
          became credit.
        example: 100000
        type: integer
      client_payment_id:
        description: ClientPaymentID is the payment just recorded - what the panel's
          undo deletes.
        type: string
      credit_cents:
        description: CreditCents is the client's credit after the payment, kept for
          their next sales.
        example: 20000
        type: integer
      sale_ids:
        description: SaleIDs are the sales whose lines changed.
        items:
          type: string
        type: array
      settled_sales:
        description: SettledSales counts the sales left with nothing to pay.
        example: 2
        type: integer
    type: object
  schemas.ClientPaymentSingleResponse:
    properties:
      data:
        $ref: '#/definitions/schemas.ClientPaymentResponse'
      message:
        type: string
      success:
        type: boolean
    type: object
  schemas.ClientPaymentUndoResponse:
    properties:
      credit_cents:
        example: 0
        type: integer
      sale_ids:
        items:
          type: string
        type: array
    type: object
  schemas.ClientPaymentUndoSingleResponse:
    properties:
      data:
        $ref: '#/definitions/schemas.ClientPaymentUndoResponse'
      message:
        example: Pagamento desfeito
        type: string
      success:
        example: true
        type: boolean
    type: object
  schemas.ClientResponse:
    properties:
      agency_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      phone:
        type: string
      updated_at:
        type: string
    type: object
  schemas.ClientSingleResponse:
    properties:
      data:
        $ref: '#/definitions/schemas.ClientResponse'
      message:
        example: Cliente encontrado
        type: string
      success:
        example: true
        type: boolean
    type: object
  schemas.ClosePeriodRequest:
    properties:
      account_id:
        type: string
      ends_on:
        example: "2026-08-31"
        type: string
      starts_on:
        example: "2026-08-01"
        type: string
    required:
    - account_id
    - ends_on
    - starts_on
    type: object
  schemas.CreateAccountBeneficiaryRequest:
    properties:
      cpf:
        description: |-
          The full CPF. It is used to compute a fingerprint and a mask and is then discarded -
          the number itself is never written to the database.
        type: string
      name:
        type: string
      used_at:
        description: |-
          When the issuance happened, which is what decides the window it falls in. Defaults to
          now, which is right for someone recording today's issuance.
        type: string
    required:
    - name
    type: object
  schemas.CreateAccountNicknameRequest:
    properties:
      loyalty_program_id:
        type: string
      nickname:
        type: string
    required:
    - loyalty_program_id
    - nickname
    type: object
  schemas.CreateAccountRequest:
    properties:
      administrator_id:
        type: string
      category:
        description: |-
          Category decides whether the program's beneficiary cap applies. Omitted means
          "unidentified", the honest default for an account nobody has classified.
        enum:
        - unidentified
        - standard
        - injunction
        type: string
      complete:
        description: Complete overrides the automatically computed value when provided
        type: boolean
      default_profit_share_percent:
        description: |-
          DefaultProfitSharePercent seeds the split on new batches of this account. Each batch
          freezes its own copy, so changing this never revises a month already settled.
        maximum: 100
        minimum: 0
        type: integer
      holder_id:
        description: |-
          HolderID is required: the panel shows an account as part of its holder's row, so one
          without a holder has nowhere to belong. Older rows may still lack it; new ones cannot.
        type: string
      login:
        type: string
      loyalty_program_id:
        type: string
      owns_point_inventory:
        description: |-
          OwnsPointInventory puts the account on the batch costing: its points were bought by
          us, so their cost comes from the batches rather than from a rate typed on
          /sales/suppliers. Omitted means false, which is every account that existed before
          this - and what keeps the costing dormant until an account is deliberately marked.
        type: boolean
      password:
        type: string
      tracks_statement:
        description: |-
          TracksStatement turns on reading this account's statement from the airline: connecting
          it, the periodic sync and the statement screens. A different question from the flag
          above - an account administered for someone else has a statement worth watching and no
          inventory to cost. Omitted means false.
        type: boolean
      waives_redemption_fee:
        description: |-
          WaivesRedemptionFee marks an account that pays no redemption fee - Azul's Diamante
          Unique. Omitted means false, which is what every account paid before this existed.
        type: boolean
    required:
    - holder_id
    - loyalty_program_id
    type: object
  schemas.CreateAgencyNicknameRequest:
    properties:
      nickname:
        type: string
    required:
    - nickname
    type: object
  schemas.CreateAgencyRequest:
    properties:
      is_default:
        type: boolean
      name:
        type: string
    required:
    - name
    type: object
  schemas.CreateAirlineRequest:
    properties:
      brand_color:
        description: |-
          BrandColor is validated as a 6-digit hex colour because it is interpolated
          straight into the ticket's CSS - a free-form string there would be a way to
          inject style rules into every ticket the airline appears on.
        type: string
      code:
        type: string
      direct_booking_enabled:
        description: |-
          DirectBookingEnabled turns on this carrier's own endpoint, when one has been
          built for it. Independent of TraveosSupported: both on at once is the normal
          state while an integration proves itself, with the vendor as the net.
        type: boolean
      name:
        type: string
      requires_last_name:
        type: boolean
      requires_origin:
        description: 'RequiresOrigin: the airline identifies a booking by the origin
          too (GOL, Azul).'
        type: boolean
      requires_purchase_number:
        type: boolean
      traveos_airline_id:
        type: integer
      traveos_supported:
        type: boolean
    required:
    - code
    - name
    type: object
  schemas.CreateAirportRequest:
    properties:
      city:
        type: string
      country:
        type: string
      iata_code:
        type: string
      name:
        type: string
      state:
        type: string
    required:
    - iata_code
    - name
    type: object
  schemas.CreateClientPaymentRequest:
    properties:
      amount_cents:
        description: |-
          AmountCents is in centavos and must be positive: money handed back is recorded on
          the sale it belongs to, not spread over a client.
        example: 120000
        type: integer
      client_id:
        type: string
      paid_on:
        description: PaidOn (YYYY-MM-DD) is the day the money moved.
        example: "2026-09-14"
        type: string
    required:
    - amount_cents
    - client_id
    - paid_on
    type: object
  schemas.CreateClientRequest:
    properties:
      agency_id:
        description: |-
          AgencyID is the agency the client buys through. Absent means the caller's default
          agency, so a panel tab opened before this field existed still creates clients.
        type: string
      name:
        type: string
      phone:
        type: string
    required:
    - name
    type: object
  schemas.CreateIssuancePassengerRequest:
    properties:
      document:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      position:
        type: integer
      type:
        enum:
        - ADT
        - CHD
        - INF
        type: string
    required:
    - first_name
    - last_name
    - position
    type: object
  schemas.CreateIssuanceRequest:
    properties:
      account_id:
        type: string
      account_nickname_id:
        description: |-
          AccountNicknameID is optional - accounts without a registered alias are still
          issuable. When present it must belong to AccountID.
        type: string
      additional_services:
        type: object
      agency_id:
        description: AgencyID defaults to the agency where is_default=true when omitted.
        type: string
      airline_id:
        description: AirlineID defaults to the loyalty program's default_airline_id
          when omitted.
        type: string
      airline_locator:
        type: string
      destination_iata_code:
        type: string
      flight_date:
        description: FlightDate (YYYY-MM-DD) creates the primary outbound flight leg.
        type: string
      issued_on:
        description: |-
          IssuedOn (YYYY-MM-DD) is the day the issuance happened, when that is not today -
          a booking found missing on a statement and recorded afterwards. Absent means now,
          which is the truth for everything recorded as it happens.
        example: "2026-09-03"
        type: string
      issuer_id:
        description: IssuerID defaults to the authenticated (JWT) user when omitted.
        type: string
      latam_purchase_number:
        type: string
      loyalty_program_id:
        type: string
      main_passenger_name:
        type: string
      observation:
        type: string
      origin_iata_code:
        type: string
      passenger_last_name:
        description: |-
          PassengerLastName is the surname typed for the airline's lookup. Optional: when
          absent the lookup falls back to main_passenger_name.
        type: string
      points:
        type: integer
      program_locator:
        type: string
      taxes:
        type: integer
      trip_type:
        enum:
        - one_way
        - round_trip
        - multi_leg
        type: string
      value_of_the_thousand:
        type: integer
    required:
    - account_id
    - loyalty_program_id
    - points
    - program_locator
    - value_of_the_thousand
    type: object
  schemas.CreateLoyaltyDocumentRequest:
    properties:
      active:
        type: boolean
      cpf:
        type: string
      loyalty_program_id:
        type: string
      name:
        type: string
    required:
    - cpf
    - loyalty_program_id
    - name
    type: object
  schemas.CreateLoyaltyProgramRequest:
    properties:
      code:
        type: string
      color:
        type: string
      cpf_limit:
        description: |-
          The beneficiary cap the panel enforces. Nil means nobody has researched this
          program's rule, which is not a cap of zero - the accounts screen then shows no
          counter at all. See data.CPFLimit* for the values.
        minimum: 0
        type: integer
      cpf_limit_mode:
        enum:
        - distinct_people
        - per_issuance
        type: string
      cpf_limit_window:
        enum:
        - calendar_year
        - rolling_12_months
        type: string
      default_airline_id:
        type: string
      name:
        type: string
      redemption_fee_advance_days:
        example: 120
        minimum: 0
        type: integer
      redemption_fee_domestic_cents:
        description: |-
          The redemption fee charged per passenger and per trecho when the ticket is issued
          fewer than RedemptionFeeAdvanceDays days before the flight. All three nil means the
          program charges no such fee, which is not the same as a fee of zero: nothing is
          computed at all. See data.LoyaltyProgram and migration 40.
        example: 6990
        minimum: 0
        type: integer
      redemption_fee_international_cents:
        example: 17490
        minimum: 0
        type: integer
    required:
    - code
    - default_airline_id
    - name
    type: object
  schemas.CreateObservationPresetRequest:
    properties:
      code:
        type: string
      text:
        type: string
    required:
    - code
    - text
    type: object
  schemas.CreatePersonNicknameRequest:
    properties:
      nickname:
        type: string
    required:
    - nickname
    type: object
  schemas.CreatePersonRequest:
    properties:
      address:
        type: string
      address_number:
        type: string
      birth_date:
        type: string
      city:
        type: string
      complement:
        type: string
      complete:
        description: Complete overrides the automatically computed value when provided
        type: boolean
      cpf:
        type: string
      email:
        type: string
      name:
        type: string
      neighborhood:
        type: string
      phone:
        type: string
      state:
        type: string
      zip_code:
        type: string
    required:
    - name
    type: object
  schemas.CreatePointBatchOriginRequest:
    properties:
      name:
        example: Livelo
        type: string
    required:
    - name
    type: object
  schemas.CreatePointBatchRequest:
    properties:
      account_id:
        type: string
      acquired_on:
        example: "2026-08-21"
        type: string
      cost_cents:
        example: 894172
        minimum: 0
        type: integer
      funding_agency_id:
        type: string
      note:
        type: string
      opening:
        example: false
        type: boolean
      origin_id:
        description: |-
          OriginID is required unless Opening is true - an opening balance was carried
          forward, not bought from anybody.
        type: string
      points:
        example: 632700
        type: integer
      profit_share_percent:
        example: 50
        maximum: 100
        minimum: 0
        type: integer
    required:
    - account_id
    - acquired_on
    - funding_agency_id
    - points
    type: object
  schemas.CreatePromoRecipeRequest:
    properties:
      active:
        type: boolean
      checkbox_selector:
        type: string
      cpf_selector:
        type: string
      domain:
        description: |-
          Domain is matched against the link's host, so it carries no scheme and no www:
          "voeazul.com.br". A subdomain may have its own row when it needs its own
          selectors; otherwise the site's row covers it.
        type: string
      failure_pattern:
        type: string
      loyalty_program_id:
        type: string
      name:
        type: string
      notes:
        type: string
      submit_selector:
        type: string
      success_pattern:
        description: |-
          SuccessPattern and FailurePattern are regular expressions matched against what
          the site shows after submitting. Empty falls back to the wording built into the
          promo service.
        type: string
      wait_seconds:
        description: |-
          WaitSeconds is how long to let the page settle before reading the form. Single
          page apps render the promotion widget after the first paint.
        maximum: 120
        minimum: 0
        type: integer
    required:
    - domain
    - loyalty_program_id
    - name
    type: object
  schemas.CreateSalePaymentRequest:
    properties:
      amount_cents:
        description: |-
          AmountCents is in centavos and may be negative - that is how money handed back to
          the client is recorded. Zero is refused: a movement of nothing is only ever a typo.
        example: 40000
        type: integer
      note:
        type: string
      paid_on:
        description: PaidOn (YYYY-MM-DD) is the day the money moved, which is what
          the operator knows.
        example: "2026-08-14"
        type: string
    required:
    - amount_cents
    - paid_on
    type: object
  schemas.CreateUserRequest:
    properties:
      agency_ids:
        description: |-
