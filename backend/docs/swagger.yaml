        required: true
        schema:
          $ref: '#/definitions/schemas.AzulBatchLinkRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.AzulBatchLinkSingleResponse'
        "400":
          description: Corpo inválido
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "403":
          description: Requer admin
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "404":
          description: Conta não encontrada
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "422":
          description: Conta sem estoque próprio ou lote não é da conta
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Erro ao salvar o vínculo
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Vincular manualmente uma linha de entrada a um lote
      tags:
      - Estoque de pontos
  /accounts/{id}/smiles-statement/commit:
    post:
      consumes:
      - application/json
      description: Soma os créditos marcados que compartilham origem e agência num
        único lote, datado no crédito mais antigo do grupo — uma compra parcelada
        em quatro entra como um lote só. O custo informado em cada crédito é somado.
        A janela é lida e conciliada de novo do zero, então uma seleção que já deixou
        de ser um crédito sem lote é pulada em vez de duplicar o lançamento. Ao fim,
        recalcula o custeio da conta.
      parameters:
      - description: Conta
        in: path
        name: id
        required: true
        type: string
      - description: Créditos marcados
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/schemas.StatementSmilesCommitRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.StatementCommitSingleResponse'
        "400":
          description: Seleção inválida
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "403":
          description: Requer admin
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "404":
          description: Conta não encontrada
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "422":
          description: Conta sem estoque próprio ou seleção grande demais
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Erro ao lançar os lotes
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Lançar lotes a partir do extrato da Smiles
      tags:
      - Estoque de pontos
  /accounts/{id}/smiles-statement/entries:
    get:
      description: Lista as linhas do extrato que o sync leu da Smiles, em ordem de
        dia, cada resgate/estorno já vinculado à emissão real do banco quando o localizador
        bate, e cada crédito vinculado ao lote correspondente. Traz o estado da sincronização
        e o período que a janela cobre. Nada é gravado.
      parameters:
      - description: Conta
        in: path
        name: id
        required: true
