            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Nenhuma agência principal configurada ou erro ao calcular saldos
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Saldo por fornecedor (Visão Fornecedores)
      tags:
      - Vendas
