      - description: 'UUID da agência (padrão: a agência principal)'
        in: query
        name: agency_id
        type: string
      - description: UUID do programa de fidelidade
        in: query
        name: loyalty_program_id
        type: string
      - description: UUID da conta
        in: query
        name: account_id
        type: string
      - description: UUID do emissor (usuário)
        in: query
        name: issuer_id
        type: string
      - description: UUID do cliente vinculado (ignorado quando client_ids vem)
        in: query
        name: client_id
        type: string
      - description: UUIDs de clientes separados por vírgula; 'none' inclui as vendas
          sem cliente
        in: query
        name: client_ids
        type: string
      - description: Filtra por vendas pagas (true) ou em aberto (false)
        in: query
        name: paid
        type: boolean
      - description: Busca por localizador, passageiro, origem ou destino da emissão
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.SaleListResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Nenhuma agência principal configurada ou erro ao buscar vendas
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Listar vendas (Visão Clientes)
      tags:
      - Vendas
  /sales/{id}:
    patch:
      consumes:
      - application/json
      description: Vincula ou desvincula o cliente, grava a observação e/ou marca
        a venda como paga. Campos ausentes ficam inalterados; client_id ou note explicitamente
        null limpam o campo.
      parameters:
      - description: UUID da venda
        in: path
        name: id
        required: true
        type: string
      - description: Campos a atualizar
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/schemas.UpdateSaleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.SaleSingleResponse'
        "400":
          description: Payload inválido ou nenhum campo informado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "404":
          description: Venda não encontrada
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "409":
          description: paid=false numa venda paga por pagamento do cliente, ou paid
            numa venda parcialmente paga
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "422":
          description: Cliente não encontrado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Erro ao atualizar venda
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Atualizar venda
      tags:
      - Vendas
  /sales/{id}/payments:
    get:
      description: Lista os lançamentos de uma venda, do mais antigo para o mais recente.
        Valor negativo é dinheiro devolvido ao cliente.
      parameters:
      - description: UUID da venda
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.SalePaymentListResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "404":
          description: Venda não encontrada
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Erro ao buscar os lançamentos
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Extrato de pagamentos de uma venda
      tags:
      - Vendas
    post:
      consumes:
      - application/json
      description: Registra dinheiro recebido do cliente. O valor é em centavos e
        pode ser negativo, que é como se registra uma devolução — o saldo da venda
        volta a subir. Zero é recusado. Depois de gravar, a venda é marcada como paga
        ou em aberto conforme a soma dos lançamentos alcance ou não o valor dela.
      parameters:
      - description: UUID da venda
        in: path
        name: id
        required: true
        type: string
      - description: Lançamento
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/schemas.CreateSalePaymentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/schemas.SalePaymentSingleResponse'
        "400":
          description: Payload inválido, valor zero ou data em formato errado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "404":
          description: Venda não encontrada
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Erro ao lançar o pagamento
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Lançar um pagamento numa venda
      tags:
      - Vendas
  /sales/{id}/payments/{paymentID}:
    delete:
      description: 'Remove um lançamento digitado errado e recalcula a situação da
        venda. Não é soft delete: um pagamento que nunca aconteceu não é história,
        é engano.'
      parameters:
      - description: UUID da venda
        in: path
        name: id
        required: true
        type: string
      - description: UUID do lançamento
        in: path
        name: paymentID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Lançamento apagado com sucesso
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "404":
          description: Lançamento não encontrado nessa venda
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "409":
          description: Lançamento veio de um pagamento do cliente
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Erro ao apagar o lançamento
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Apagar um lançamento
      tags:
      - Vendas
  /sales/client-payments:
    get:
      description: Com client_id, lista os pagamentos do cliente, do mais antigo para
        o mais recente, incluindo os desfeitos, com as vendas em que cada um está
        abatido e o crédito que sobra. Sem client_id, lista os pagamentos de todos
        os clientes da agência (ou dos de client_ids) recebidos no período, do mais
        recente para o mais antigo, e o crédito somado deles.
      parameters:
      - description: UUID do cliente
        in: query
        name: client_id
        type: string
      - description: 'Sem client_id: UUIDs de clientes separados por vírgula (padrão:
          todos da agência)'
        in: query
        name: client_ids
        type: string
      - description: 'Sem client_id: UUID da agência (padrão: a agência principal)'
        in: query
        name: agency_id
        type: string
      - description: 'Sem client_id: primeiro dia de recebimento (YYYY-MM-DD), inclusivo'
        in: query
        name: date_from
        type: string
      - description: 'Sem client_id: último dia de recebimento (YYYY-MM-DD), inclusivo'
        in: query
        name: date_to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.ClientPaymentHistorySingleResponse'
        "400":
          description: client_id inválido
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Erro ao buscar os pagamentos
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Histórico de pagamentos do cliente
      tags:
      - Vendas
    post:
      consumes:
      - application/json
      description: Recebe um valor do cliente e abate nas vendas dele em aberto, da
        emissão mais antiga para a mais nova; a última alcançada pode ficar parcial.
        O que sobrar vira crédito do cliente e é abatido nas próximas vendas vinculadas
        a ele. O pagamento fica no histórico do cliente e pode ser desfeito por DELETE
        /sales/client-payments/{id}.
      parameters:
      - description: Pagamento
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/schemas.CreateClientPaymentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/schemas.ClientPaymentSingleResponse'
        "400":
          description: Payload inválido, valor não positivo ou data em formato errado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "422":
          description: Cliente não encontrado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Erro ao registrar o pagamento
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Registrar um pagamento do cliente
      tags:
      - Vendas
  /sales/client-payments/{paymentID}:
    delete:
      description: Marca o pagamento como desfeito (ele continua no histórico) e redistribui
        os pagamentos restantes do cliente pelas vendas em aberto, da mais antiga
        para a mais nova.
      parameters:
      - description: UUID do pagamento do cliente
        in: path
        name: paymentID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.ClientPaymentUndoSingleResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "404":
          description: Pagamento não encontrado ou já desfeito
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Erro ao desfazer o pagamento
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Desfazer um pagamento do cliente
      tags:
      - Vendas
  /sales/clients/report:
