          AccountNumber is the programme's own number for the account, when the file states
          it. Advisory: it lets the screen warn that the file may be from another account.
        example: "03303567123"
        type: string
      bookings:
        items:
          $ref: '#/definitions/schemas.StatementBookingLine'
        type: array
      credits:
        items:
          $ref: '#/definitions/schemas.StatementCreditLine'
        type: array
      from:
        description: From and To are the statement's own span, not a window anybody
          chose.
        example: "2026-07-22"
        type: string
      panel_net_points:
        example: -158800
        type: integer
      refunds:
        items:
          $ref: '#/definitions/schemas.StatementRefundLine'
        type: array
      statement_net_points:
        description: |-
          StatementNetPoints and PanelNetPoints are the change in balance each side claims.
          Neither export states a balance, so agreeing on the change is the only check there
          is - and disagreeing means something above was missed.
        example: -158800
        type: integer
      to:
        example: "2026-09-07"
        type: string
    type: object
  schemas.StatementRefundLine:
