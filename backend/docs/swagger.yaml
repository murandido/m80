  /sales/page:
    get:
      description: 'Mesmos filtros e mesma ordem de GET /sales (da emissão mais antiga
        para a mais recente), mas devolvendo só a janela pedida por offset/limit,
        junto do total de vendas no filtro. É o que deixa o painel mostrar o histórico
        inteiro sem carregar tudo: ele pede só o trecho que está na tela. owed_cents
        é o total devido quando o filtro tem exatamente um cliente, e zero fora disso.'
      parameters:
      - description: Posição da primeira venda da janela (0 = a mais antiga)
        in: query
        name: offset
        type: integer
      - description: Tamanho da janela (padrão 100, máximo 200)
        in: query
        name: limit
        type: integer
      - description: Data inicial da emissão (YYYY-MM-DD), inclusiva
        in: query
        name: date_from
        type: string
      - description: Data final da emissão (YYYY-MM-DD), inclusiva
        in: query
        name: date_to
        type: string
      - description: 'UUID da agência (padrão: a agência principal)'
        in: query
        name: agency_id
        type: string
      - description: UUIDs de clientes separados por vírgula; 'none' inclui as vendas
          sem cliente
        in: query
        name: client_ids
        type: string
      - description: Filtra por vendas pagas (true) ou em aberto (false)
        in: query
        name: paid
        type: boolean
      - description: Busca por localizador, passageiro, origem ou destino da emissão
        in: query
        name: q
