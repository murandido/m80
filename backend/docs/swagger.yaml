    type: object
  legacyimport.ResolvedBlock:
    properties:
      index:
        type: integer
      issuer_id:
        type: string
      issuer_name:
        type: string
      rows:
        items:
          $ref: '#/definitions/legacyimport.ResolvedRow'
        type: array
    type: object
  legacyimport.ResolvedRow:
    properties:
      account_id:
        type: string
      account_label:
        description: |-
          AccountLabel is the alias as the spreadsheet has it; AccountName is what the
          panel will show for the account it resolved to. Both, because the operator is
          checking one against the other.
        type: string
      account_name:
        type: string
      account_nickname_id:
        type: string
      airline_locator:
        type: string
      airline_name:
        type: string
      block_index:
        type: integer
      cancellation:
        allOf:
        - $ref: '#/definitions/legacyimport.CancellationPlan'
        description: |-
          Cancellation is set on an estorno line and nil on every other row. The row's own
          figures stay positive: what the preview shows is the issuance, and this is what
          will be done to it.
      destination_iata_code:
        type: string
      flight_date:
        type: string
      issuer_id:
        type: string
      issuer_name:
        type: string
      loyalty_program_id:
        type: string
      loyalty_program_name:
        type: string
      main_passenger_name:
        type: string
      notes:
        description: |-
          Notes are things worth seeing that do not stop the row from being written -
          an origin or destination the airports table does not know, a partial estorno.
        items:
          type: string
        type: array
      number:
        type: integer
      observation:
        type: string
      origin_iata_code:
        type: string
      points:
        type: integer
      program_locator:
        type: string
      reason:
        description: Reason explains a verdict that is not Ok, in the operator's language.
        type: string
      taxes:
        type: integer
      value_of_the_thousand:
        type: integer
      verdict:
        $ref: '#/definitions/legacyimport.Verdict'
    type: object
  legacyimport.SkippedRow:
    properties:
      block_index:
        type: integer
      locator:
        type: string
      number:
