      type:
        enum:
        - ADT
        - CHD
        - INF
        type: string
    type: object
  schemas.UpdateIssuanceRequest:
    properties:
      account_id:
        type: string
      account_nickname_id:
        description: |-
          AccountNicknameID is only read when AccountID is also present - the two are
          updated as a unit. See UpdateIssuance for why.
        type: string
      additional_services:
        type: object
      agency_id:
        type: string
      airline_id:
        type: string
      airline_locator:
        type: string
      destination_iata_code:
        type: string
      flight_date:
        description: FlightDate (YYYY-MM-DD) upserts the primary outbound flight leg's
          departure date.
        type: string
      issued_on:
        description: |-
          IssuedOn (YYYY-MM-DD) moves the issuance to another day. The time of day is kept,
          so two rows recorded in the same session keep their order in the FIFO queue.
        example: "2026-09-03"
        type: string
      issuer_id:
        type: string
      latam_purchase_number:
        type: string
      loyalty_program_id:
        type: string
      main_passenger_name:
        type: string
      observation:
        type: string
      origin_iata_code:
        type: string
      passenger_last_name:
        description: |-
          PassengerLastName is the surname typed for the airline's lookup. Optional: when
          absent the lookup falls back to main_passenger_name.
        type: string
      points:
        type: integer
      program_locator:
        type: string
      redemption_fee_saved_cents:
        description: |-
          The redemption fee this issuance avoided, in centavos, corrected by hand. A value pins
          the correction against the automatic recalculation; an explicit null releases the
          issuance back to the rule and recomputes it on the spot.

          This field is the reason the handler reads the raw body as well as the struct: for
          every other field here an absent key and a JSON null both decode to nil and mean
          "leave alone", and that is exactly the distinction the override needs.
        example: 6990
        minimum: 0
        type: integer
      status:
        description: |-
          Status transitions the issuance between incomplete/complete/cancelled. "deleted"
          is not a valid value here - it's only reachable via DELETE /issuances/{id}.
        enum:
        - incomplete
        - complete
        - cancelled
        type: string
      taxes:
        type: integer
      trip_type:
        enum:
        - one_way
        - round_trip
        - multi_leg
        type: string
      value_of_the_thousand:
        type: integer
    type: object
  schemas.UpdateLoyaltyDocumentRequest:
    properties:
      active:
        type: boolean
      cpf:
        type: string
      loyalty_program_id:
        type: string
      name:
        type: string
    type: object
  schemas.UpdateLoyaltyProgramRequest:
    properties:
      code:
        type: string
      color:
        type: string
      cpf_limit:
        description: |-
          The beneficiary cap the panel enforces. Nil means nobody has researched this
          program's rule, which is not a cap of zero - the accounts screen then shows no
          counter at all. See data.CPFLimit* for the values.
        minimum: 0
        type: integer
      cpf_limit_mode:
        enum:
        - distinct_people
        - per_issuance
        type: string
      cpf_limit_window:
        enum:
        - calendar_year
        - rolling_12_months
        type: string
      default_airline_id:
        type: string
      name:
        type: string
      redemption_fee_advance_days:
        example: 120
        minimum: 0
        type: integer
      redemption_fee_domestic_cents:
        description: |-
          The redemption fee charged per passenger and per trecho when the ticket is issued
          fewer than RedemptionFeeAdvanceDays days before the flight. All three nil means the
          program charges no such fee, which is not the same as a fee of zero: nothing is
          computed at all. See data.LoyaltyProgram and migration 40.
        example: 6990
        minimum: 0
        type: integer
      redemption_fee_international_cents:
        example: 17490
        minimum: 0
        type: integer
    type: object
  schemas.UpdateMeRequest:
    properties:
      current_password:
        type: string
      name:
        type: string
      new_password:
        maxLength: 20
        minLength: 6
        type: string
      phone:
        type: string
    type: object
  schemas.UpdateObservationPresetRequest:
    properties:
      code:
        type: string
      text:
        type: string
    type: object
  schemas.UpdatePersonNicknameRequest:
    properties:
      nickname:
        type: string
    type: object
  schemas.UpdatePersonRequest:
    properties:
      address:
        type: string
      address_number:
        type: string
      birth_date:
        type: string
      city:
        type: string
      complement:
        type: string
      complete:
        description: Complete overrides the automatically recomputed value when provided
        type: boolean
      cpf:
        type: string
      email:
        type: string
      name:
        type: string
      neighborhood:
        type: string
      phone:
        type: string
      state:
        type: string
      zip_code:
        type: string
    type: object
  schemas.UpdatePointBatchOriginRequest:
    properties:
      active:
        type: boolean
      name:
        type: string
    type: object
  schemas.UpdatePointBatchRequest:
    properties:
      acquired_on:
        example: "2026-08-21"
        type: string
      cost_cents:
        minimum: 0
        type: integer
      funding_agency_id:
        type: string
      note:
        type: string
      origin_id:
        type: string
      points:
        type: integer
      profit_share_percent:
        maximum: 100
        minimum: 0
        type: integer
    type: object
  schemas.UpdatePromoRecipeRequest:
    properties:
      active:
        type: boolean
      checkbox_selector:
        type: string
      cpf_selector:
        type: string
      domain:
        type: string
      failure_pattern:
        type: string
      loyalty_program_id:
        type: string
      name:
        type: string
      notes:
        type: string
      submit_selector:
        type: string
      success_pattern:
        type: string
      wait_seconds:
        maximum: 120
        minimum: 0
        type: integer
    type: object
  schemas.UpdateSaleRequest:
    properties:
      amount_cents:
        description: |-
          AmountCents sets what the client pays for the sale, in centavos: the total, not the
          difference. The server keeps the difference from the computed price, so sending the
          computed price back clears it. Refused on a cancelled sale, whose amount is its fee.
        minimum: 0
        type: integer
      client_id:
        type: string
      note:
        description: |-
          Note follows client_id's rules: absent leaves it alone, and an explicit null - or an
          empty string - clears it.
        maxLength: 1000
        type: string
      paid:
        description: |-
          Paid is the one-click switch. It is translated into the statement: true records a
          payment for whatever is missing, false clears the statement. Partial amounts go
          through /sales/{id}/payments or, for a lump sum over several sales,
          /sales/client-payments.
        type: boolean
    type: object
  schemas.UpdateSupplierIssuancesRequest:
    properties:
      cancelled_cpf_fee:
        description: |-
          CancelledCPFFee is what the supplier charges, in centavos, for the CPFs a cancelled
          booking burned. Only accepted on cancelled issuances; null clears it.
        example: 12000
        minimum: 0
        type: integer
      cost_of_the_thousand:
        description: |-
          CostOfTheThousand is in centavos. Null clears the rate back to "not agreed yet",
          which is what makes the payment summary refuse to generate again.
        example: 1650
        minimum: 0
        type: integer
      issuance_ids:
        description: |-
          IssuanceIDs is required and must not be empty - an UPDATE with no WHERE is not a
          reachable state through this endpoint.
        items:
          type: string
        maxItems: 1000
        minItems: 1
        type: array
      reviewed:
        description: |-
          Reviewed marks these issuances as already checked while reconciling. Unlike the two
          terms above it changes no money - it records who has already looked.
        example: true
        type: boolean
      taxes_included_in_cost:
        description: TaxesIncludedInCost says whether the taxes are reimbursed on
          these issuances.
        example: true
        type: boolean
    required:
    - issuance_ids
    type: object
  schemas.UpdateSupplierIssuancesResponse:
    properties:
      updated:
        example: 47
        type: integer
    type: object
  schemas.UpdateSupplierIssuancesSingleResponse:
    properties:
      data:
        $ref: '#/definitions/schemas.UpdateSupplierIssuancesResponse'
      message:
        example: Emissões atualizadas com sucesso
        type: string
      success:
        example: true
        type: boolean
    type: object
  schemas.UpdateUserRequest:
    properties:
      agency_ids:
        description: |-
          AgencyIDs replaces the user's agencies when present - an empty list removes them all.
          Absent (null) leaves them alone, which is what a panel tab opened before this field
          existed keeps sending. Only a dev may send it.
        items:
          type: string
        type: array
      name:
        type: string
      password:
        maxLength: 20
        minLength: 6
        type: string
      phone:
        type: string
      role:
        enum:
        - user
        - admin
        - dev
        type: string
    type: object
  schemas.UserListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/schemas.UserResponse'
        type: array
      message:
        example: Usuários listados com sucesso
        type: string
      success:
        example: true
        type: boolean
    type: object
  schemas.UserResponse:
    properties:
      agency_ids:
        description: |-
          AgencyIDs are the agencies granted to the user. Always empty for a dev: the role
          itself means every agency.
        items:
          type: string
        type: array
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      phone:
        type: string
      role:
        type: string
    type: object
  schemas.UserSingleResponse:
    properties:
      data:
        $ref: '#/definitions/schemas.UserResponse'
      message:
        example: Usuário encontrado
        type: string
      success:
        example: true
        type: boolean
    type: object
  schemas.VaultAccountResponse:
    properties:
      has_password:
        type: boolean
      holder_name:
        type: string
      id:
        type: string
      login:
        type: string
      nicknames:
        items:
          type: string
        type: array
      program:
        $ref: '#/definitions/schemas.VaultProgram'
    type: object
  schemas.VaultProgram:
    properties:
      code:
        type: string
      color:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  utils.StandardResponse:
    properties:
      data:
        description: '''omitempty'' removes the field from JSON if it''s nil'
      message:
        type: string
      success:
        type: boolean
    type: object
host: localhost:8080
info:
  contact:
    email: murandido@gmail.com
    name: murandido
  description: API de controle do painel M-80. Gerencie usuários e autenticação.
  title: M-80 API
  version: "1.0"
paths:
  /accounts:
    get:
      description: Retorna todas as contas cadastradas no sistema.
      parameters:
      - description: Busca por login, titular, administrador, programa ou apelido
        in: query
        name: q
        type: string
      - description: Ordenação
        enum:
        - name_asc
        - name_desc
        - created_desc
        - created_asc
        in: query
        name: order
        type: string
      - description: UUID do programa de fidelidade
        in: query
        name: loyalty_program_id
        type: string
      - description: Categoria da conta
        enum:
        - unidentified
        - standard
        - injunction
        in: query
        name: category
        type: string
      - description: Somente contas completas (true) ou incompletas (false)
        in: query
        name: complete
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.AccountListResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Erro ao buscar contas
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Listar contas
      tags:
      - Contas
    post:
      consumes:
      - application/json
      description: Cria uma nova conta de programa de fidelidade no sistema. O titular
        é obrigatório.
      parameters:
      - description: Dados da nova conta
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/schemas.CreateAccountRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/schemas.AccountSingleResponse'
        "400":
          description: Payload inválido ou sem titular
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "422":
          description: Programa de fidelidade, titular ou administrador informado
            não existe
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Erro ao criar conta
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Criar conta
      tags:
      - Contas
  /accounts/{id}:
    delete:
      description: 'Apaga a conta de verdade quando nada a referencia; com histórico
        (emissões, inclusive na lixeira; lotes; períodos; extrato; beneficiários)
        ela é arquivada: some das listagens e dos seletores, e as emissões antigas
        continuam mostrando em que conta foram feitas. Os apelidos vão junto nos dois
        casos.'
      parameters:
      - description: UUID da conta
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Conta apagada ou arquivada
          schema:
            $ref: '#/definitions/schemas.AccountRemovalSingleResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "422":
          description: Conta ainda referenciada por outro registro
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Erro ao arquivar conta
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Deletar conta
      tags:
      - Contas
    get:
      description: Retorna os dados de uma conta específica identificada pelo UUID.
      parameters:
      - description: UUID da conta
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.AccountSingleResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "404":
          description: Conta não encontrada
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Buscar conta por ID
      tags:
      - Contas
    put:
      consumes:
      - application/json
      description: Atualiza os dados de uma conta existente. Todos os campos são opcionais
        (atualização parcial).
      parameters:
      - description: UUID da conta
        in: path
        name: id
        required: true
        type: string
      - description: Campos a atualizar
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/schemas.UpdateAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.AccountSingleResponse'
        "400":
          description: Payload inválido
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "404":
          description: Conta não encontrada
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "422":
          description: Programa de fidelidade, titular ou administrador informado
            não existe
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Erro ao atualizar conta
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Atualizar conta
      tags:
      - Contas
  /accounts/{id}/azul-connect:
    post:
      description: Dispara, em segundo plano, o login que descobre o customerKey da
        conta e o guarda cifrado. Retorna 202 na hora; o painel acompanha pelo estado
        da sincronização (campo connecting em GET /accounts/{id}/azul-statement),
        que vira "conectado" no sucesso ou um estado de erro na falha. Após N falhas
        seguidas a conta é marcada como "precisa de atenção". Uma segunda chamada
        enquanto um login já está em andamento é recusada com 409.
      parameters:
      - description: Conta a conectar
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/schemas.AzulConnectSingleResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "403":
          description: Requer admin
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "404":
          description: Conta não encontrada
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "409":
          description: Já existe um login em andamento para esta conta
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "422":
          description: Conta sem login/senha
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Conectar conta Azul (descobrir o customerKey)
      tags:
      - Estoque de pontos
  /accounts/{id}/azul-statement:
    get:
      description: Concilia o extrato que o coletor sincronizou da Azul (tabela azul_statement_lines)
        com o que o painel tem da conta, no período que a janela sincronizada cobre.
        Não há upload — a Azul deixou de subir CSV. Devolve as três listas com o veredito
        de cada linha e nada é gravado. Crédito sem lote é o achado que importa. Conta
        sem janela sincronizada devolve uma comparação vazia.
      parameters:
      - description: Conta a conciliar
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.AzulStatementSingleResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "403":
          description: Requer admin
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "404":
          description: Conta não encontrada
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "422":
          description: Conta sem estoque próprio
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Erro ao conciliar
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Conciliar extrato sincronizado da Azul
      tags:
      - Estoque de pontos
  /accounts/{id}/azul-statement/batch-links:
    delete:
      consumes:
      - application/json
      description: Apaga o vínculo manual de uma linha de compra ou acúmulo, devolvendo-a
        ao casamento automático por créditos. A resposta traz como a linha passa a
        resolver.
      parameters:
      - description: Conta
        in: path
        name: id
        required: true
        type: string
      - description: Chave da linha
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/schemas.AzulBatchLinkDeleteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.AzulBatchLinkSingleResponse'
        "400":
          description: Corpo inválido
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "403":
          description: Requer admin
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "404":
          description: Conta não encontrada
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "422":
          description: Conta sem estoque próprio
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Erro ao remover o vínculo
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Remover o vínculo manual de uma linha de entrada com o lote
      tags:
      - Estoque de pontos
    post:
      consumes:
      - application/json
      description: Fixa o vínculo de uma linha de compra ou acúmulo a um lote da conta,
        substituindo o vínculo automático (que casa pelos créditos que o lote guardou).
        O lote precisa ser da própria conta.
      parameters:
      - description: Conta
        in: path
        name: id
        required: true
        type: string
      - description: Chave da linha e lote
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/schemas.AzulBatchLinkRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.AzulBatchLinkSingleResponse'
        "400":
          description: Corpo inválido
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "403":
          description: Requer admin
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "404":
          description: Conta não encontrada
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "422":
          description: Conta sem estoque próprio ou lote não é da conta
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Erro ao salvar o vínculo
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Vincular manualmente uma linha de entrada a um lote
      tags:
      - Estoque de pontos
  /accounts/{id}/azul-statement/commit:
    post:
      consumes:
      - application/json
      description: Soma os créditos marcados que compartilham origem e agência num
        único lote, datado no crédito mais antigo do grupo. O extrato é relido da
        janela sincronizada e conciliado de novo do zero, então uma seleção que já
        deixou de ser um crédito sem lote é pulada em vez de duplicar o lançamento.
        Ao fim, recalcula o custeio da conta.
      parameters:
      - description: Conta
        in: path
        name: id
        required: true
        type: string
      - description: Créditos marcados
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/schemas.StatementAzulCommitRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.StatementCommitSingleResponse'
        "400":
          description: Seleção inválida
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "403":
          description: Requer admin
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "404":
          description: Conta não encontrada
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "422":
          description: Conta sem estoque próprio ou seleção grande demais
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Erro ao lançar os lotes
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Lançar lotes a partir do extrato sincronizado da Azul
      tags:
      - Estoque de pontos
  /accounts/{id}/azul-statement/entries:
    get:
      description: Lista as linhas do extrato que o coletor sincronizou da Azul (tabela
        azul_statement_lines), em ordem de dia, cada resgate/reembolso já vinculado
        à emissão real do banco quando o localizador bate (ignorando a data, como
        o lote). Traz o estado da sincronização para o cabeçalho e o período que a
        janela cobre. Nada é gravado. Conta sem janela sincronizada devolve lista
        vazia.
      parameters:
      - description: Conta
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.AzulStatementEntriesSingleResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "403":
          description: Requer admin
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "404":
          description: Conta não encontrada
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "422":
          description: Conta sem estoque próprio
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Erro ao carregar o extrato
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Extrato sincronizado da Azul, com vínculo de emissões
      tags:
      - Estoque de pontos
  /accounts/{id}/azul-statement/export:
    get:
      description: Baixa o extrato sincronizado da conta como CSV no mesmo formato
        que a Azul exportava (Conta, Data, Operação, Localizador, Valor, Origem, Destino,
        Descrição), em ordem de dia. As quatro operações antigas (Resgate, Reembolso,
        Acúmulo de voo, Acúmulo de pontos) são reimportáveis; expiração e outros saem
        rotulados.
      parameters:
      - description: Conta
        in: path
        name: id
        required: true
        type: string
      - description: Primeiro dia (YYYY-MM-DD, dia de Brasília)
        in: query
        name: date_from
        type: string
      - description: Último dia, inclusive (YYYY-MM-DD, dia de Brasília)
        in: query
        name: date_to
        type: string
      produces:
      - text/csv
      responses:
        "200":
          description: CSV do extrato
          schema:
            type: string
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "403":
          description: Requer admin
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "404":
          description: Conta não encontrada
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "422":
          description: Conta sem estoque próprio
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Erro ao gerar o CSV
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Exportar o extrato sincronizado da Azul em CSV
      tags:
      - Estoque de pontos
  /accounts/{id}/azul-statement/links:
    delete:
      consumes:
      - application/json
      description: Apaga o vínculo manual de um localizador, devolvendo-o ao vínculo
        automático por localizador. A resposta traz como o localizador passa a resolver
        (o automático, ou nulo se não houver).
      parameters:
      - description: Conta
        in: path
        name: id
        required: true
        type: string
      - description: Localizador
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/schemas.AzulBookingLinkDeleteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.AzulBookingLinkSingleResponse'
        "400":
          description: Corpo inválido
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "403":
          description: Requer admin
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "404":
          description: Conta não encontrada
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "422":
          description: Conta sem estoque próprio
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Erro ao remover o vínculo
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Remover o vínculo manual de uma linha do extrato
      tags:
      - Estoque de pontos
    post:
      consumes:
      - application/json
      description: Fixa o vínculo de um localizador do extrato a uma emissão real
        da conta, substituindo o vínculo automático. A emissão precisa ser da própria
        conta. Usado pelo modo de edição da página de extrato.
      parameters:
      - description: Conta
        in: path
        name: id
        required: true
        type: string
      - description: Localizador e emissão
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/schemas.AzulBookingLinkRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.AzulBookingLinkSingleResponse'
        "400":
          description: Corpo inválido
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "403":
          description: Requer admin
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "404":
          description: Conta não encontrada
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "422":
          description: Conta sem estoque próprio ou emissão não é da conta
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Erro ao salvar o vínculo
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Vincular manualmente uma linha do extrato a uma emissão
      tags:
      - Estoque de pontos
  /accounts/{id}/azul-statement/status:
    get:
      description: Devolve só o "crachá" da sincronização (conectado, conectando +
        desde quando, último saldo e última sincronização), sem carregar as linhas
        do extrato. É o que o card da conta consulta em intervalo enquanto um login
        roda em segundo plano, para saber quando ele terminou sem sobreviver a um
        F5 travado. Conta nunca sincronizada devolve estado "pending", não erro.
      parameters:
      - description: Conta
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.AzulSyncStateSingleResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "403":
          description: Requer admin
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "404":
          description: Conta não encontrada
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Erro ao carregar o estado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Estado da conexão/sincronização da conta Azul
      tags:
      - Estoque de pontos
  /accounts/{id}/beneficiaries:
    get:
      description: Retorna as pessoas que já foram emitidas nesta conta, com quantas
        emissões cada uma tem e quando foi a última. O CPF só aparece mascarado —
        o número não é armazenado.
      parameters:
      - description: UUID da conta
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.AccountBeneficiaryListResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Erro ao buscar beneficiários
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Listar beneficiários da conta
      tags:
      - Contas
    post:
      consumes:
      - application/json
      description: Registra à mão uma pessoa emitida nesta conta — para o caso em
        que a emissão não está no sistema. Se o CPF for informado, apenas a impressão
        digital e a máscara são guardadas; o número não.
      parameters:
      - description: UUID da conta
        in: path
        name: id
        required: true
        type: string
      - description: Dados do beneficiário
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/schemas.CreateAccountBeneficiaryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/schemas.AccountBeneficiarySingleResponse'
        "400":
          description: Payload inválido
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "422":
          description: Beneficiário já existe nesta conta
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Erro ao criar beneficiário
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Adicionar beneficiário à conta
      tags:
      - Contas
  /accounts/{id}/beneficiaries/{beneficiaryID}:
    delete:
      description: Apaga um beneficiário e as emissões que ele consumiu nesta conta.
        Use para quem entrou errado — não para desfazer um cancelamento, já que a
        vaga usada não volta.
      parameters:
      - description: UUID da conta
        in: path
        name: id
        required: true
        type: string
      - description: UUID do beneficiário
        in: path
        name: beneficiaryID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Beneficiário removido
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "404":
          description: Beneficiário não encontrado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Erro ao remover beneficiário
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Remover um beneficiário
      tags:
      - Contas
    patch:
      consumes:
      - application/json
      description: Corrige o nome ou informa o CPF de um beneficiário. O CPF é guardado
        como impressão digital e máscara — o número não fica no banco.
      parameters:
      - description: UUID da conta
        in: path
        name: id
        required: true
        type: string
      - description: UUID do beneficiário
        in: path
        name: beneficiaryID
        required: true
        type: string
      - description: Campos a corrigir
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/schemas.UpdateAccountBeneficiaryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.AccountBeneficiarySingleResponse'
        "400":
          description: Payload inválido
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "404":
          description: Beneficiário não encontrado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Erro ao atualizar beneficiário
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Corrigir um beneficiário
      tags:
      - Contas
  /accounts/{id}/beneficiaries/{beneficiaryID}/merge:
    post:
      consumes:
