          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "422":
          description: Conta sem estoque próprio ou período fora de ordem
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Erro ao fechar período
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Fechar período do estoque
      tags:
      - Estoque de pontos
  /inventory-periods/{id}:
    delete:
      description: Desfaz o fechamento e devolve o período ao recálculo. Só o último
        período fechado da conta pode ser reaberto. O acerto já registrado nos lotes
        não é desfeito.
      parameters:
      - description: ID do período
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Período reaberto com sucesso
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
