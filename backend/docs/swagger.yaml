        "400":
          description: Payload inválido
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "403":
          description: Usuário não é administrador
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Erro ao incrementar os contadores
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Incrementar o contador de vários administradores
      tags:
      - Vendas
  /sales/suppliers/issuances:
    post:
      consumes:
      - application/json
      description: 'Grava o milheiro de custo (em centavos), se as taxas entram no
        valor e/ou a taxa de CPF cancelado (em centavos, só em emissões canceladas),
        nas emissões informadas. Recebe a lista explícita de ids, nunca um filtro:
        um id é a edição de uma linha, vários são a aplicação em massa. Campo omitido
        é preservado; cost_of_the_thousand ou cancelled_cpf_fee explicitamente nulo
        limpa o valor. Rota restrita a administradores.'
      parameters:
      - description: Emissões e os termos de pagamento
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/schemas.UpdateSupplierIssuancesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.UpdateSupplierIssuancesSingleResponse'
        "400":
          description: Payload inválido
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "403":
          description: Usuário não é administrador
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "422":
          description: Custo vindo do estoque, ou taxa de CPF em emissão não cancelada
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Erro ao gravar os termos de pagamento
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Definir os termos de pagamento ao fornecedor
      tags:
      - Vendas
  /sales/suppliers/report:
    get:
      description: Gera o PDF do resumo de emissões a pagar ao administrador da conta,
        com os mesmos filtros da tela de Fornecedores. Com account_id, sai o documento
        de uma conta; sem, sai uma seção por conta filtrada. As taxas entram no valor
        emissão a emissão, conforme taxes_included_in_cost de cada uma. Recusa com
        422 se alguma emissão do documento estiver sem milheiro de custo. Rota restrita
        a administradores.
      parameters:
      - description: Data inicial do período (YYYY-MM-DD), inclusiva
        in: query
        name: date_from
        type: string
      - description: Data final do período (YYYY-MM-DD), inclusiva
        in: query
        name: date_to
        type: string
      - description: 'UUID da agência (padrão: a agência principal)'
        in: query
        name: agency_id
        type: string
      - description: UUIDs de agências separados por vírgula, ou 'all' para todas
        in: query
        name: agency_ids
        type: string
      - description: UUID do programa de fidelidade
        in: query
        name: loyalty_program_id
        type: string
      - description: UUID da conta - restringe o documento a ela
        in: query
        name: account_id
        type: string
      - description: UUIDs de contas separados por vírgula a excluir do documento
        in: query
        name: exclude_account_ids
        type: string
      - description: UUID do administrador da conta
        in: query
        name: administrator_id
        type: string
      - description: 'Agrupamento das seções: account (padrão) ou administrator'
        in: query
        name: group_by
        type: string
      produces:
      - application/pdf
      responses:
        "200":
          description: PDF do resumo
          schema:
            type: file
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "403":
          description: Usuário não é administrador
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "422":
          description: Há emissões sem milheiro de custo
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "502":
          description: Serviço de PDF indisponível
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Resumo de pagamento ao fornecedor (PDF)
      tags:
      - Vendas
  /status:
    get:
      description: 'Diz se o bot do WhatsApp, a Traveos e cada integração direta com
        companhia aérea estão no ar, a partir de sondas que rodam em background (bot
        a cada 60s, Traveos a cada 120s, cada companhia a cada 10min) somadas ao resultado
        das buscas reais. Aberta a qualquer usuário autenticado, de propósito: quem
        trabalha na grid de emissões é quem precisa saber que a vendor caiu. Não devolve
        o código de pareamento nem o JID do bot — esses continuam só no proxy dev
        `/bot/*`.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.SystemStatus'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Status das dependências
      tags:
      - Status
  /users:
    get:
      description: 'Retorna todos os usuários cadastrados no sistema (sem senhas).
        Acessível a qualquer usuário autenticado (ex: para popular o combobox de "emissor"
        em outras telas).'
      parameters:
      - description: Busca por nome ou telefone
        in: query
        name: q
        type: string
      - description: Ordenação
        enum:
        - name_asc
        - name_desc
        - created_desc
        - created_asc
        in: query
        name: order
        type: string
      - description: Perfil
        enum:
        - admin
        - user
        - dev
        in: query
        name: role
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.UserListResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Erro ao buscar usuários
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Listar usuários
      tags:
      - Usuários
    post:
      consumes:
      - application/json
      description: Cria um novo usuário no sistema. Apenas administradores podem acessar.
      parameters:
      - description: Dados do novo usuário
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/schemas.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/schemas.UserSingleResponse'
        "400":
          description: Payload inválido
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "403":
          description: Acesso restrito a administradores; agências e perfil de desenvolvedor
            só por desenvolvedores
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "422":
          description: Agência inexistente
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Erro ao criar usuário
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Criar usuário
      tags:
      - Usuários
  /users/{id}:
    delete:
      description: Remove um usuário do sistema via soft delete (marca deleted_at,
        não apaga fisicamente).
      parameters:
      - description: UUID do usuário
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Usuário deletado com sucesso
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "403":
          description: Acesso restrito a administradores; contas de desenvolvedor
            só por desenvolvedores
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Erro ao deletar usuário
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Deletar usuário
      tags:
      - Usuários
    get:
      description: Retorna os dados de um usuário específico identificado pelo UUID.
      parameters:
      - description: UUID do usuário
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.UserSingleResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "403":
          description: Acesso restrito a administradores
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "404":
          description: Usuário não encontrado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Buscar usuário por ID
      tags:
      - Usuários
    put:
      consumes:
      - application/json
      description: Atualiza os dados de um usuário existente. Todos os campos são
        opcionais (atualização parcial).
      parameters:
      - description: UUID do usuário
        in: path
        name: id
        required: true
        type: string
      - description: Campos a atualizar
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/schemas.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.UserSingleResponse'
        "400":
          description: Payload inválido
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "403":
          description: Acesso restrito a administradores; agências, perfil e contas
            de desenvolvedor só por desenvolvedores
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "404":
          description: Usuário não encontrado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "422":
          description: Agência inexistente
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Erro ao atualizar usuário
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Atualizar usuário
      tags:
      - Usuários
securityDefinitions:
  BearerAuth:
    description: 'Informe o token JWT no formato: Bearer {token}'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
