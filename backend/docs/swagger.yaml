  /inventory-periods:
    get:
      description: Períodos já fechados de uma conta, do mais recente para o mais
        antigo.
      parameters:
      - description: ID da conta
        in: query
        name: account_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.InventoryPeriodListResponse'
        "400":
          description: account_id ausente
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "403":
          description: Requer admin
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Erro ao listar períodos
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Listar períodos fechados
      tags:
      - Estoque de pontos
    post:
      consumes:
      - application/json
      description: Recalcula o custeio da conta e congela o período. A partir daí,
        cancelamento de emissão dentro dele vira estorno no período aberto.
      parameters:
      - description: Conta e intervalo
        in: body
