        type: string
      - description: UUID do programa de fidelidade
        in: query
        name: loyalty_program_id
        type: string
      - description: UUID da conta
        in: query
        name: account_id
        type: string
      - description: UUID do emissor (usuário)
        in: query
        name: issuer_id
        type: string
      - description: UUID do cliente vinculado (ignorado quando client_ids vem)
