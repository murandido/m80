      - description: UUIDs de clientes separados por vírgula; 'none' inclui as vendas
          sem cliente
        in: query
        name: client_ids
        type: string
      - description: Filtra por vendas pagas (true) ou em aberto (false)
        in: query
        name: paid
        type: boolean
      - description: Busca por localizador, passageiro, origem ou destino da emissão
        in: query
        name: q
        type: string
      produces:
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      responses:
        "200":
          description: Planilha .xlsx das vendas filtradas
          schema:
            type: file
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Nenhuma agência principal configurada ou erro ao gerar a planilha
