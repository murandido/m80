  /accounts/{id}/smiles-connect:
    delete:
      description: Apaga a sessão guardada e a janela de extrato sincronizada, deixando
        a conta como antes de ser conectada. Os lotes já lançados a partir do extrato
        não são tocados — só o extrato sincronizado some. Reconectar exige um código
        novo.
      parameters:
      - description: Conta
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.SmilesConnectSingleResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "403":
          description: Requer admin
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "404":
          description: Conta não encontrada
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Erro ao desconectar
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Desconectar a conta Smiles
      tags:
      - Estoque de pontos
    post:
      description: 'Faz o login na Smiles com o login e a senha já salvos na conta.
        Normalmente a Smiles exige um código de verificação: a resposta traz mfa_required
        e a lista de canais cadastrados pelo titular (SMS/e-mail), com o destino mascarado.
        O painel então escolhe um canal em /smiles-connect/challenge e envia os dígitos
        em /smiles-connect/code. Se a conta não exigir segundo fator, ela já fica
        conectada.'
      parameters:
      - description: Conta a conectar
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.SmilesConnectSingleResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "403":
          description: Requer admin
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "404":
          description: Conta não encontrada
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "422":
          description: Conta sem login/senha, ou credenciais recusadas
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "429":
          description: A Smiles está limitando as tentativas
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "503":
          description: A Smiles não respondeu
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Conectar conta Smiles (primeiro passo do login)
      tags:
      - Estoque de pontos
  /accounts/{id}/smiles-connect/challenge:
    post:
      consumes:
      - application/json
      description: Pede à Smiles que envie o código no canal escolhido (um dos ids
        devolvidos por /smiles-connect). Cada chamada dispara um SMS ou e-mail de
        verdade, e a Smiles limita reenvios por canal — então o painel não reenvia
        sozinho. Responde com o canal e o destino mascarado, para a tela dizer onde
        o código chegou.
      parameters:
      - description: Conta
        in: path
        name: id
        required: true
        type: string
      - description: Canal escolhido
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/schemas.SmilesChallengeRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/schemas.SmilesChallengeSingleResponse'
        "400":
          description: Corpo inválido
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "403":
          description: Requer admin
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "404":
          description: Conta não encontrada
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "409":
          description: Não há login em andamento, ou ele expirou
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "422":
          description: Canal não é da conta
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "429":
          description: A Smiles está limitando os envios
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Pedir o código de verificação da Smiles
      tags:
      - Estoque de pontos
  /accounts/{id}/smiles-connect/code:
    post:
      consumes:
      - application/json
      description: 'Troca o código digitado pela sessão da conta, guarda a sessão
        cifrada e dispara em segundo plano a primeira sincronização do extrato. Código
        errado devolve 422 com a recusa da Smiles, sem reenviar nada: a Smiles conta
        tentativas e um reenvio automático bloquearia o titular. Código expirado devolve
        409 e o login recomeça.'
      parameters:
      - description: Conta
        in: path
        name: id
        required: true
        type: string
      - description: O código recebido
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/schemas.SmilesCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.SmilesConnectSingleResponse'
        "400":
          description: Corpo inválido
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "403":
          description: Requer admin
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "404":
          description: Conta não encontrada
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "409":
          description: O código expirou; recomece o login
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "422":
          description: Código não confere
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Confirmar o código de verificação da Smiles
      tags:
      - Estoque de pontos
  /accounts/{id}/smiles-statement:
    get:
      description: 'Compara o extrato que o sync leu da Smiles com o que o painel
        tem da conta, no período que a janela cobre. Devolve três listas — emissões,
        reembolsos e créditos — cada linha com o veredito, mais o estado da sincronização.
        Nada é gravado. Crédito sem lote é o achado que importa: são milhas que entraram
        e nunca foram precificadas.'
      parameters:
      - description: Conta
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.SmilesStatementSingleResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "403":
          description: Requer admin
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "404":
          description: Conta não encontrada
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "422":
          description: Conta sem estoque próprio
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Erro ao conciliar
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Conciliar o extrato sincronizado da Smiles
      tags:
      - Estoque de pontos
  /accounts/{id}/smiles-statement/batch-links:
    delete:
      consumes:
      - application/json
      description: Apaga o vínculo manual de uma linha de compra ou acúmulo, devolvendo-a
        ao casamento automático por créditos. A resposta traz como a linha passa a
        resolver.
      parameters:
      - description: Conta
        in: path
        name: id
        required: true
        type: string
      - description: Chave da linha
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/schemas.AzulBatchLinkDeleteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.AzulBatchLinkSingleResponse'
        "400":
          description: Corpo inválido
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "403":
          description: Requer admin
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "404":
          description: Conta não encontrada
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "422":
          description: Conta sem estoque próprio
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Erro ao remover o vínculo
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Remover o vínculo manual de uma linha de entrada com o lote
      tags:
      - Estoque de pontos
    post:
      consumes:
      - application/json
      description: Fixa o vínculo de uma linha de compra ou acúmulo a um lote da conta,
        substituindo o vínculo automático (que casa pelos créditos que o lote guardou).
        O lote precisa ser da própria conta.
      parameters:
      - description: Conta
        in: path
