  /sales/export:
    get:
      description: Gera uma planilha .xlsx das vendas filtradas, com as colunas DATA,
        CLIENTE, LOCALIZADOR, EMISSÃO e STATUS, da mais antiga para a mais recente.
        Aceita os mesmos filtros da listagem. STATUS é PG (paga), APG (em aberto)
        ou CANC (emissão cancelada, tenha sido paga ou não).
      parameters:
      - description: Data inicial da emissão (YYYY-MM-DD), inclusiva
