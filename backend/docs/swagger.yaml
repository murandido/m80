  /dashboard:
    get:
      description: Agrega as emissões do período em totais, série temporal, e rollups
        por programa de fidelidade e por emissor. Sem agency_id, filtra pela agência
        principal (is_default=true). Emissões canceladas ficam fora de todo o volume
        (contagem, pontos, valor e rollups), em qualquer período — mesmo que o cancelamento
        tenha ocorrido fora da janela consultada; elas aparecem apenas em cancelled_count
        e refunded_points, pela data do cancelamento. O campo amount_cents é omitido
        para o usuário comum; administradores e desenvolvedores veem os valores.
      parameters:
      - description: Data inicial do período (YYYY-MM-DD), inclusiva
        in: query
        name: date_from
        type: string
      - description: Data final do período (YYYY-MM-DD), inclusiva
        in: query
        name: date_to
        type: string
      - default: day
        description: Tamanho do bucket da série temporal
        enum:
        - hour
        - day
        - week
        - month
        in: query
        name: granularity
        type: string
      - description: 'UUID da agência (padrão: a agência principal)'
        in: query
        name: agency_id
        type: string
      - description: UUID do programa de fidelidade
        in: query
        name: loyalty_program_id
        type: string
      - description: UUID da cia aérea
        in: query
        name: airline_id
        type: string
      - description: UUID do emissor (usuário)
        in: query
        name: issuer_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.DashboardSingleResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Nenhuma agência principal configurada ou erro ao calcular o
            dashboard
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Métricas agregadas do dashboard
      tags:
      - Dashboard
  /events:
    get:
      description: 'Conexão Server-Sent Events de longa duração. Emite eventos nomeados
        (ex: issuance.created, issuance.updated, issuance.cancelled, issuance.deleted,
        sale.updated) cujo data é um JSON com o id do recurso afetado, além de comentários
        de heartbeat a cada 25s. O cliente deve usar EventSource, que já reconecta
        sozinho.'
      produces:
      - text/event-stream
      responses:
        "200":
          description: Stream de eventos
          schema:
            type: string
        "401":
