      tags:
      - Emissões
  /issuances/{id}/uncancel:
    post:
      consumes:
      - application/json
      description: Reverte o cancelamento de uma emissão (active=true, limpa cancelled_at/cancelled_by
        e os valores de reembolso). O status volta a ser derivado de complete. Se
        o cancelamento havia resetado o pagamento da venda associada, restaura paid=true,
        voltando ao estado original. Grava um audit log. Tudo numa única transação.
      parameters:
      - description: UUID da emissão
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
