      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.SalePageSingleResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Erro ao buscar vendas
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Listar uma janela de vendas (Visão Clientes)
      tags:
      - Vendas
  /sales/suppliers:
    get:
      description: Agrega, por conta, as milhas emitidas no período menos as devolvidas
        por cancelamentos no mesmo período. Sem agency_id nem agency_ids, filtra pela
        agência principal (is_default=true); agency_ids aceita uma lista ou 'all'.
        Emissões excluídas não entram. Rota restrita a administradores.
      parameters:
      - description: Data inicial do período (YYYY-MM-DD), inclusiva
        in: query
        name: date_from
        type: string
      - description: Data final do período (YYYY-MM-DD), inclusiva
        in: query
        name: date_to
        type: string
      - description: 'UUID da agência (padrão: a agência principal)'
        in: query
        name: agency_id
        type: string
      - description: UUIDs de agências separados por vírgula, ou 'all' para todas.
          Tem precedência sobre agency_id
        in: query
        name: agency_ids
        type: string
      - description: UUID do programa de fidelidade
        in: query
        name: loyalty_program_id
        type: string
      - description: UUID da conta
        in: query
        name: account_id
        type: string
      - description: UUIDs de contas separados por vírgula a excluir do resultado
        in: query
        name: exclude_account_ids
        type: string
      - description: UUID do administrador da conta (people.id)
        in: query
        name: administrator_id
        type: string
      - description: 'Agrupamento das linhas: account (padrão) ou administrator'
