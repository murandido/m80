  /issuances/{id}/traveos-sync:
    post:
      description: 'Busca o bilhete na Traveos (emitindo lá primeiro, se ainda não
        existir) e grava passageiros, voos, assentos, bagagens, rota e tipo de viagem
        na emissão, marcando-a como completa. Sempre força: uma emissão já sincronizada
        é repuxada de propósito, porque é assim que uma alteração de voo entra no
        sistema.'
      parameters:
      - description: UUID da emissão
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
