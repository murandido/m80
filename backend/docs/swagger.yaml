  /accounts/holders:
    get:
      description: 'Uma linha por titular vivo, com todas as contas de programa dele;
        pessoas sem conta também aparecem. Os filtros escolhem linhas: a linha traz
        todas as contas não arquivadas do titular, não só as que casaram. Com busca,
        quem casa pelo próprio nome vem primeiro (nome igual, depois começando pelo
        termo, depois uma palavra começando pelo termo, depois contendo), e só então
        quem casou por outro campo ou pelas contas; a ordem escolhida desempata dentro
        de cada faixa.'
      parameters:
      - description: Busca por nome, e-mail, telefone, cidade, apelido, CPF completo,
          login, administrador ou programa
        in: query
        name: q
        type: string
      - description: Ordenação
        enum:
        - name_asc
        - name_desc
        - created_desc
        - created_asc
        in: query
        name: order
        type: string
      - description: Somente titulares com conta neste programa
        in: query
        name: loyalty_program_id
        type: string
      - description: Somente titulares com conta nesta categoria
        enum:
        - unidentified
        - standard
        - injunction
        in: query
        name: category
        type: string
      - description: 'true: titular e todas as contas completos; false: algo incompleto'
        in: query
        name: complete
        type: boolean
      - description: Página (padrão 1)
        in: query
        name: page
        type: integer
      - description: Itens por página (padrão 20, máximo 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
