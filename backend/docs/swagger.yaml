            $ref: '#/definitions/schemas.ErrorResponse'
        "422":
          description: Conta sem estoque próprio
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Erro ao gerar o CSV
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Exportar o extrato sincronizado da Smiles em CSV
      tags:
      - Estoque de pontos
