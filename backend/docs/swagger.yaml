      summary: Reabrir período do estoque
      tags:
      - Estoque de pontos
  /issuances:
    get:
      description: Retorna as emissões cadastradas no sistema (exclui as removidas),
        da mais antiga para a mais recente. Aceita filtros opcionais por data, programa
        de fidelidade, cia aérea, conta, agência e emissor. As emissões canceladas
        também entram no filtro de data/usuário pela data e pelo usuário do cancelamento
        (cancelled_at/cancelled_by_id), não só pela criação.
      parameters:
      - description: Data inicial da emissão (YYYY-MM-DD), inclusiva
        in: query
        name: date_from
        type: string
      - description: Data final da emissão (YYYY-MM-DD), inclusiva
        in: query
        name: date_to
        type: string
      - description: UUID do programa de fidelidade
        in: query
        name: loyalty_program_id
        type: string
      - description: UUID da cia aérea
        in: query
        name: airline_id
        type: string
      - description: UUID da conta
        in: query
        name: account_id
        type: string
      - description: UUID da agência
        in: query
        name: agency_id
        type: string
      - description: Busca por localizador, passageiro, origem ou destino. Quando
          presente, os filtros de data e emissor são ignorados.
        in: query
        name: q
        type: string
      - description: UUID do emissor (usuário). Aceita vários separados por vírgula;
          o token 'all' não filtra (todos os emissores) e 'none' não retorna nenhum.
        in: query
        name: issuer_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.IssuanceListResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Erro ao buscar emissões
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Listar emissões
      tags:
      - Emissões
    post:
      consumes:
      - application/json
      description: Cria uma nova emissão. issuer_id usa o usuário autenticado (JWT)
        se omitido, agency_id usa a agência padrão se omitido, e a emissão sempre
        nasce com complete=false. Uma venda em aberto (client_id=null, paid=false)
        é criada na mesma transação. flight_date (YYYY-MM-DD) cria a data de partida
        da perna de ida principal. account_nickname_id é opcional e, quando informado,
        precisa pertencer à conta em account_id. issued_on (YYYY-MM-DD) registra a
        emissão em outro dia — uma que faltava e foi lançada depois; omitido, vale
        agora.
      parameters:
      - description: Dados da nova emissão
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/schemas.CreateIssuanceRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/schemas.IssuanceSingleResponse'
        "400":
          description: Payload inválido, flight_date com formato inválido, código
            IATA inexistente ou apelido que não pertence à conta
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "403":
          description: Usuário sem acesso a nenhuma agência
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "404":
          description: Agência fora do escopo do usuário
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "422":
          description: Program locator já está em uso por uma emissão ativa
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Erro ao criar emissão
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Criar emissão
      tags:
      - Emissões
  /issuances/{id}:
    delete:
      description: Remove (soft delete) uma emissão, registra o audit log e apaga
        a venda associada, se houver. Diferente do cancelamento, uma emissão deletada
        não deixa venda em aberto - ela some da aba de Vendas.
      parameters:
      - description: UUID da emissão
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Emissão deletada com sucesso
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "404":
          description: Emissão não encontrada
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Erro ao deletar emissão
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Deletar emissão
      tags:
      - Emissões
    get:
      description: Retorna os dados completos de uma emissão específica, incluindo
        os voos.
      parameters:
      - description: UUID da emissão
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.IssuanceSingleResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "404":
          description: Emissão não encontrada
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Buscar emissão por ID
      tags:
      - Emissões
    patch:
      consumes:
      - application/json
      description: Atualiza um subconjunto de campos de uma emissão existente. complete
        não é aceito diretamente - use status, que é traduzido para complete/cancelled_at.
        flight_date (YYYY-MM-DD) cria ou atualiza a data de partida da perna de ida
        principal. issued_on (YYYY-MM-DD) move a emissão para outro dia, mantendo
        a hora; numa conta com estoque próprio, uma data dentro de período fechado
        é recusada com 422.
      parameters:
      - description: UUID da emissão
        in: path
        name: id
        required: true
        type: string
      - description: Campos a atualizar
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/schemas.UpdateIssuanceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.IssuanceSingleResponse'
        "400":
          description: Payload inválido, flight_date com formato inválido ou código
            IATA inexistente
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "404":
          description: Emissão não encontrada
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "422":
          description: Program locator já está em uso, ou a emissão foi marcada como
            completa sem um campo que a cia aérea exige
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Erro ao atualizar emissão
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Atualizar emissão (autosave)
      tags:
      - Emissões
  /issuances/{id}/adjustments:
    post:
      consumes:
      - application/json
      description: 'Registra uma alteração feita na passagem depois da emissão: pontos
        e/ou taxas cobrados a mais pela cia (positivos) ou devolvidos por ela (negativos),
        datados pelo dia em que aconteceram. value_of_the_thousand é o milheiro cobrado
        do cliente por esses pontos (0 quando a agência absorve) e taxes_passed_to_client
        diz se as taxas vão para a conta do cliente. A venda é recalculada, o custeio
        FIFO consome ou devolve na data informada e a ação vai para o audit log. Emissão
        cancelada não aceita alteração; data dentro de período fechado é recusada.'
      parameters:
      - description: UUID da emissão
        in: path
        name: id
        required: true
        type: string
      - description: A alteração
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/schemas.IssuanceAdjustmentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/schemas.IssuanceAdjustmentSingleResponse'
        "400":
          description: Payload inválido
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "404":
          description: Emissão não encontrada
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "422":
          description: Emissão cancelada, alteração vazia, sem motivo ou em período
            fechado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Erro ao registrar a alteração
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Registrar alteração de passagem
      tags:
      - Emissões
  /issuances/{id}/adjustments/{adjustmentID}:
    delete:
      description: Remove (soft delete) uma alteração registrada por engano. A venda
        e o custeio voltam a não contar com ela, e a remoção vai para o audit log.
        Recusada se a data da alteração estiver em período fechado.
      parameters:
      - description: UUID da emissão
        in: path
        name: id
        required: true
        type: string
      - description: UUID da alteração
        in: path
        name: adjustmentID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Alteração excluída com sucesso
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "404":
          description: Emissão ou alteração não encontrada
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "422":
          description: Emissão cancelada ou período fechado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Erro ao excluir a alteração
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Excluir alteração de passagem
      tags:
      - Emissões
    patch:
      consumes:
      - application/json
      description: Substitui todos os campos de uma alteração já registrada (corrige
        o que foi digitado). As mesmas regras do registro valem, e tanto a data antiga
        quanto a nova precisam estar fora de período fechado.
      parameters:
      - description: UUID da emissão
        in: path
        name: id
        required: true
        type: string
      - description: UUID da alteração
        in: path
        name: adjustmentID
        required: true
        type: string
      - description: A alteração
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/schemas.IssuanceAdjustmentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.IssuanceAdjustmentSingleResponse'
        "400":
          description: Payload inválido
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "404":
          description: Emissão ou alteração não encontrada
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "422":
          description: Emissão cancelada, alteração vazia, sem motivo ou em período
            fechado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Erro ao corrigir a alteração
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Corrigir alteração de passagem
      tags:
      - Emissões
