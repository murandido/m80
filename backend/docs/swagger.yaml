          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "404":
          description: Conta não encontrada
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "422":
          description: Conta sem estoque próprio
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Erro ao carregar o extrato
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Extrato sincronizado da Smiles, com vínculo de emissões
      tags:
      - Estoque de pontos
  /accounts/{id}/smiles-statement/export:
    get:
      description: Baixa o extrato sincronizado da conta como CSV (Conta, Data, Operação,
        Localizador, Valor, Origem, Destino, Descrição), em ordem de dia — as mesmas
        colunas do export da Azul, para o operador lidar com um formato só.
      parameters:
