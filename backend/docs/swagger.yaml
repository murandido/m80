            $ref: '#/definitions/schemas.ErrorResponse'
        "503":
          description: Nenhum provedor configurado neste servidor
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Prévia da reserva
      tags:
      - Emissões
  /issuances/summary:
