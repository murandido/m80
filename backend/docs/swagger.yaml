  /accounts/{id}/latam-connect:
    delete:
      description: Apaga a sessão guardada, deixando a conta como antes de ser conectada.
        O último saldo lido continua na conta. Reconectar exige um login novo na LATAM.
      parameters:
      - description: Conta
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
