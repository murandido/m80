    get:
      description: Lucro por lote, acerto entre agências e pendências, por conta e
        consolidado. Não congela nada — para isso, feche o período.
      parameters:
      - description: IDs das contas, separados por vírgula
        in: query
        name: account_ids
        required: true
        type: string
      - description: Início do período (AAAA-MM-DD)
