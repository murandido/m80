            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Reverter cancelamento de emissão
      tags:
      - Emissões
  /issuances/export:
    get:
      description: 'Gera uma planilha .xlsx das emissões filtradas. O layout é escolhido
        por layout: control (padrão) ou legacy. Layout control: planilha manual de
        controle numa aba única (a emissão cancelada é atribuída a quem cancelou,
        que é onde a listagem também a mostra), colunas A:O (Nº, Companhia, Localizador,
        Data do Voo, Passageiro Principal, Origem, Destino, Pontos, Milheiro, Taxa,
        Total, Conta, Observação, Taxa Resgate, Emissor), as linhas agrupadas em blocos
        por companhia, o bloco TOTAL DAS CONTAS ao final e, ao lado da tabela, um
        quadro por conta e companhia com os localizadores e o total de pontos. A coluna
        Emissor identifica quem fez cada linha, já que todos os emissores ficam na
        mesma aba. Dentro de cada bloco a ordem é a da listagem (da mais antiga para
        a mais recente). Aceita os mesmos filtros da listagem (data, programa de fidelidade,
        cia aérea, conta, agência e emissor). Emissão cancelada no mesmo dia em que
        foi criada entra pelo líquido (pontos e taxas menos o reembolso); cancelada
        em outro dia entra só pelo reembolso, negativo. A linha cancelada é destacada
        em vermelho claro. Layout legacy: a antiga planilha EMISSÕES GERAIS, uma tabela
        só (B:P) com os totais do modelo, mais a coluna TAXA RESGATE em Q. Nos dois
        layouts a Taxa Resgate é a taxa que a conta isenta (Azul Diamante Unique)
        deixou de pagar, em branco nas contas comuns, com o mesmo sinal dos pontos.'
      parameters:
      - description: Data inicial da emissão (YYYY-MM-DD), inclusiva
        in: query
        name: date_from
        type: string
      - description: Data final da emissão (YYYY-MM-DD), inclusiva
        in: query
        name: date_to
        type: string
      - description: UUID do programa de fidelidade
        in: query
        name: loyalty_program_id
        type: string
      - description: UUID da cia aérea
        in: query
        name: airline_id
        type: string
      - description: UUID da conta
        in: query
        name: account_id
        type: string
      - description: UUID da agência
        in: query
        name: agency_id
        type: string
      - description: Busca por localizador, passageiro, origem ou destino. Quando
          presente, os filtros de data e emissor são ignorados.
        in: query
        name: q
        type: string
      - description: UUID do emissor (usuário). Aceita vários separados por vírgula;
          o token 'all' não filtra (todos os emissores) e 'none' não retorna nenhum.
        in: query
        name: issuer_id
        type: string
      - description: 'Layout da planilha: control (padrão) ou legacy'
        enum:
        - control
        - legacy
        in: query
        name: layout
        type: string
      produces:
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      responses:
        "200":
          description: Planilha .xlsx das emissões filtradas
          schema:
            type: file
        "400":
          description: Layout desconhecido
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Erro ao gerar a planilha
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Exportar emissões (.xlsx)
      tags:
      - Emissões
  /issuances/legacy-import/commit:
    post:
      consumes:
      - multipart/form-data
      description: Grava as linhas marcadas de um dia da planilha. O arquivo é lido
        e resolvido de novo do zero - a prévia é conselho, não contrato -, então o
        cliente manda quais linhas quer (rows), nunca o conteúdo delas. Linhas que
        não resolvem, ou cujo localizador já existe, são puladas com o motivo em vez
        de derrubar o dia inteiro. As emissões nascem incompletas, com created_at
        no dia da aba e imported=true. Uma linha de estorno cancela a emissão do localizador
        do mesmo jeito que o botão Cancelar do painel; se ela não existir, é criada
        e cancelada em seguida, e a resposta conta as duas coisas separadas em cancelled
        e created_and_cancelled.
      parameters:
      - description: Planilha .xlsx
        in: formData
        name: file
        required: true
        type: file
      - description: Dia a importar (YYYY-MM-DD)
        in: formData
        name: day
        required: true
        type: string
      - description: JSON com as escolhas de conta, emissor, agência e programa padrão
        in: formData
        name: mappings
        type: string
      - description: JSON com as linhas marcadas ([{block_index, number}])
        in: formData
        name: rows
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.LegacyImportCommitSingleResponse'
        "400":
          description: Arquivo, dia ou seleção inválidos
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "403":
          description: Não é admin
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "422":
          description: Seleção maior que o teto de linhas por dia
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Erro ao importar
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Importar um dia da planilha manual
      tags:
      - Emissões
  /issuances/legacy-import/preview:
    post:
      consumes:
      - multipart/form-data
      description: 'Lê a planilha enviada e devolve os dias que ela contém. Com o
        campo day (YYYY-MM-DD), devolve também a prévia daquele dia: cada linha já
        resolvida em ids, com o veredito de importação, mais os apelidos de conta
        e os nomes de emissor que faltam mapear. Uma linha de pontos negativos é um
        estorno: vem com o veredito cancellation e um objeto cancellation dizendo
        se ela cancela a emissão que já existe ou se cria e cancela. Nada é gravado.
        mappings é o JSON com as escolhas feitas na tela, para a prévia refletir o
        que o commit faria.'
      parameters:
      - description: Planilha .xlsx
        in: formData
        name: file
        required: true
        type: file
      - description: Dia a detalhar (YYYY-MM-DD)
        in: formData
        name: day
        type: string
      - description: JSON com as escolhas de conta, emissor, agência e programa padrão
        in: formData
        name: mappings
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.LegacyImportPreviewSingleResponse'
        "400":
          description: Arquivo ausente, grande demais ou ilegível
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "401":
          description: Não autenticado
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "403":
          description: Não é admin
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Erro ao ler a planilha
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Prévia da importação da planilha manual
      tags:
      - Emissões
  /issuances/lookup:
    post:
      consumes:
      - application/json
      description: Consulta a reserva nos provedores da cia (a integração direta primeiro,
        a Traveos atrás) antes de a emissão existir, e devolve rota, data do voo e
        passageiro principal para o formulário. Não grava nada no banco; a Traveos
        pode importar a reserva, como faria no sync. O itinerário completo só é gravado
