      direct_found:
        description: The direct integration's own attempts, by outcome.
        type: integer
      direct_not_found:
        type: integer
      direct_provider:
        description: |-
          DirectProvider is the name of the airline's registered integration ("copa"), empty
          when none is registered on this server.
        example: copa
        type: string
      direct_refused:
        type: integer
      direct_unavailable:
        type: integer
      fell_back_to_traveos:
        type: integer
      name:
        example: COPA AIRLINES
        type: string
      recent_failures:
        description: |-
          RecentFailures are the latest direct attempts that did not find the booking, newest
          first, capped.
        items:
          $ref: '#/definitions/schemas.LookupFailure'
        type: array
      syncs:
        type: integer
      traveos_supported:
        type: boolean
      unanswered:
        type: integer
