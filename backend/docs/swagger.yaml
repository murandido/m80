      - description: UUID do beneficiário que permanece
        in: path
        name: beneficiaryID
        required: true
        type: string
      - description: Beneficiário a ser absorvido
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/schemas.MergeAccountBeneficiaryRequest'
      produces:
      - application/json
      responses:
