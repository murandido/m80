      description: 'Gera o PDF que a agência envia ao cliente: as emissões do período
        com valor, quanto já foi pago, quanto falta e a situação de cada uma. Aceita
        os mesmos filtros da tela de Controle de pagamentos; sai uma seção por cliente,
        e as vendas sem cliente numa seção própria. Responde 422 se não houver emissão
