version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - gosec
    - bodyclose
    - contextcheck
    - errorlint
    - nilerr
    - sqlclosecheck
    - rowserrcheck
  settings:
    errorlint:
      # The codebase wraps a sentinel with %w and formats the cause with %v on
      # purpose ("%w: %v"): callers match the sentinel, and the transport error
      # stays text. In some of those calls the cause can be nil, where %w would
      # print "%!w(<nil>)". The comparison and type-assertion checks stay on.
      errorf: false
  exclusions:
    paths:
      # Vendored third-party code kept as received; linting it would mean
      # maintaining a fork of someone else's style.
      - carriers/third_party
